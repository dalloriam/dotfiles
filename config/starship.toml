# Default module order, with the per-VCS modules (git_*, hg_*, fossil_*,
# pijul_*) folded into `$vcs` so a colocated jj repo shows jj instead of git.
# `$all` can't be used here: it would render the git modules a second time.
format = """
$username$hostname$localip$shlvl$singularity$kubernetes$nats\
$directory$vcsh$vcs\
$docker_context$package\
$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel\
$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven\
$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto\
$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant\
$xmake$zig\
$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage\
$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$custom\
$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os\
$shell$character"""

[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]

[aws]
disabled = true

[gcloud]
disabled = true

[rust]
disabled = true

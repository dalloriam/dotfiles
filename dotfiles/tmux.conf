# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
unbind C-b
set-option -g prefix C-Space

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 10          # low latency for <Esc> in nvim, but not 0 (avoids kitty-protocol race)
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-keys vi
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ---------------------------------------------------------------------------
# Splits & panes (mirrors zellij "tmux" mode muscle memory: % right, " down)
# ---------------------------------------------------------------------------
bind g split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane

# Resize panes, repeatable without re-pressing prefix (mirrors zellij resize mode)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane movement without prefix (kept from prior config)
bind -n M-l select-pane -R
bind -n M-h select-pane -L
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ---------------------------------------------------------------------------
# Seamless neovim <-> tmux pane navigation (vim-tmux-navigator, no plugin manager needed)
# Ctrl-hjkl moves between tmux panes, or forwards to nvim's own split
# navigation when the focused pane is running nvim. Ctrl-j/k additionally
# cycle a pane "stack" (see above) when the focused pane is its visible
# member, instead of just moving focus up/down the grid.
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ---------------------------------------------------------------------------
# Copy mode (mirrors zellij scroll/search modes)
# ---------------------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind [ copy-mode
bind / copy-mode \; send -X search-backward-text ""   # quick entry into search, like zellij's "s"

# ---------------------------------------------------------------------------
# Session handling (mirrors zellij session mode: detach, switch)
# ---------------------------------------------------------------------------
bind d detach-client

bind n run-shell "re -C '#{pane_current_path}' 1"
bind m run-shell "re -C '#{pane_current_path}' 2"
bind , run-shell "re -C '#{pane_current_path}' 3"
bind . run-shell "re -C '#{pane_current_path}' 4"
bind C-Space run-shell "re -C '#{pane_current_path}'"        # picker without letting go of Ctrl
bind Space run-shell "re -C '#{pane_current_path}'"
bind -n C-d run-shell "re -C '#{pane_current_path}' edit"

# ---------------------------------------------------------------------------
# Plugins (TPM) — tmux-resurrect/continuum offset the loss of zellij's
# built-in session_serialization. Install TPM once:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then prefix + I inside tmux to fetch plugins.
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @sessionx-bind o

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#50fa7b #282a36"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#50fa7b #282a36"

set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"


run '~/.tmux/plugins/tpm/tpm'
